<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Game Boy Emulator - GitHub Pages</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; text-align: center; padding: 20px; }
        #container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        #rom-list-container { background: #333; padding: 15px; border-radius: 8px; width: 220px; text-align: left; }
        #rom-list { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; }
        #rom-list li { padding: 10px; background: #444; margin-bottom: 5px; cursor: pointer; border-radius: 4px; border-left: 4px solid #007bff; }
        #rom-list li:hover { background: #555; }
        #emulator-wrapper { background: #000; border: 4px solid #444; border-radius: 8px; width: 320px; height: 288px; display: flex; align-items: center; justify-content: center; }
        #emulator { width: 100%; height: 100%; image-rendering: pixelated; }
        .controls-info { font-size: 13px; color: #aaa; margin-top: 10px; background: #111; padding: 10px; border-radius: 5px; display: inline-block; }
        #status { color: #ffc107; font-weight: bold; margin-bottom: 10px; }
    </style>
    <!-- Ενσωμάτωση του επίσημου, σταθερού αρχείου GameBoyCore απευθείας από έμπιστο CDN της κοινότητας JS -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <h1>Game Boy Emulator</h1>
    <div id="status">Έτοιμο. Επιλέξτε παιχνίδι:</div>

    <div id="container">
        <div id="rom-list-container">
            <h3>Παιχνίδια:</h3>
            <ul id="rom-list"></ul>
        </div>

        <div>
            <div id="emulator-wrapper">
                <canvas id="emulator" width="160" height="144"></canvas>
            </div>
            <br>
            <div class="controls-info">
                <strong>Χειρισμός:</strong> Βέλη = Κίνηση | <strong>Z</strong> = A | <strong>X</strong> = B | <strong>Enter</strong> = Start | <strong>Shift</strong> = Select
            </div>
        </div>
    </div>

    <script>
        const romList = document.getElementById('rom-list');
        const canvas = document.getElementById('emulator');
        const statusDiv = document.getElementById('status');
        let gbInstance = null;

        // 1. Το όνομα του αρχείου σας (Προσοχή στα κεφαλαία/πεζά!)
        const myRoms = [
            "pokemon_red.gb"
        ];

        function init() {
            romList.innerHTML = '';
            myRoms.forEach(romName => {
                const li = document.createElement('li');
                li.textContent = romName.replace('.gb', '').replaceAll('_', ' ');
                li.addEventListener('click', () => loadRom(romName));
                romList.appendChild(li);
            });
        }

        function loadRom(romName) {
            statusDiv.textContent = `Φόρτωση του ${romName}...`;
            
            // Δοκιμή φόρτωσης από τον φάκελο roms/
            fetch(`roms/${romName}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Δεν βρέθηκε το αρχείο "roms/${romName}". Ελέγξτε αν τα γράμματα είναι πεζά/κεφαλαία στο GitHub!`);
                    }
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    startEmulator(buffer);
                    statusDiv.textContent = `Τώρα παίζει: ${romName}`;
                })
                .catch(err => {
                    statusDiv.textContent = "Σφάλμα φόρτωσης αρχείου";
                    alert(err.message);
                });
        }

        function startEmulator(buffer) {
            // Καθαρισμός προηγούμενου session
            if (gbInstance && gbInstance.interval) {
                clearInterval(gbInstance.interval);
            }

            // Μετατροπή των δεδομένων σε text string που απαιτεί ο συγκεκριμένος core
            const data = new Uint8Array(buffer);
            let romString = "";
            for (let i = 0; i < data.length; i++) {
                romString += String.fromCharCode(data[i]);
            }

            try {
                // Εκκίνηση του Emulator
                gbInstance = new GameBoyCore(canvas, romString);
                gbInstance.start();

                // Σύνδεση πλήκτρων
                window.onkeydown = function(e) { gbInstance.KeyDown(e); };
                window.onkeyup = function(e) { gbInstance.KeyUp(e); };
            } catch (e) {
                alert("Σφάλμα κατά την εκκίνηση του emulator: " + e.message);
            }
        }

        init();
    </script>
</body>
</html>

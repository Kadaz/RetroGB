<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Boy Live Emulator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; text-align: center; margin: 0; padding: 20px; }
        #emulator-container { width: 640px; height: 480px; max-width: 100%; margin: 20px auto; background: #000; border: 4px solid #333; border-radius: 8px; }
        .btn { background: #4caf50; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 10px; transition: 0.2s; }
        .btn:hover { background: #45a049; }
    </style>
</head>
<body>

    <h1>Game Boy Emulator (EmulatorJS)</h1>
    <p>Πατήστε το κουμπί για να ξεκινήσει το παιχνίδι απευθείας από τον φάκελο roms/.</p>
    
    <!-- Κουμπί για έναρξη -->
    <button class="btn" onclick="startGame()">Έναρξη Darkwing Duck</button>

    <!-- Το παράθυρο του Emulator -->
    <div id="emulator-container">
        <div id="game"></div>
    </div>

    <script>
        function startGame() {
            // Ρυθμίσεις του EmulatorJS
            window.EJS_player = '#game';
            window.EJS_biosUrl = ''; // Δεν χρειάζεται BIOS για το Game Boy
            window.EJS_gameUrl = 'roms/Darkwing_Duck.gb'; // Η διαδρομή της ROM σας
            window.EJS_core = 'gb'; // Το σύστημα (Game Boy)
            window.EJS_pathtodata = 'https://emulatorjs.org'; // Έτοιμα αρχεία συστήματος από το επίσημο CDN τους
            window.EJS_startOnLoaded = true;

            // Φόρτωση του επίσημου script του EmulatorJS που τρέχει το παιχνίδι
            let script = document.createElement('script');
            script.src = 'https://emulatorjs.orgloader.js';
            document.head.appendChild(script);
        }
    </script>

</body>
</html>

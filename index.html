```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>RetroGB - Game Boy / Game Boy Color</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div id="app">

    <h1>GAME BOY / GAME BOY COLOR</h1>


    <div id="rom-list">
        Loading ROMs...
    </div>


    <div id="status">
        Initializing emulator...
    </div>


    <div id="game-container">

        <canvas
            id="screen"
            width="160"
            height="144"
        ></canvas>

    </div>


    <div id="controls">

        <div class="dpad">

            <button
                class="up"
                data-key="ArrowUp"
            >▲</button>

            <button
                class="left"
                data-key="ArrowLeft"
            >◀</button>

            <button
                class="down"
                data-key="ArrowDown"
            >▼</button>

            <button
                class="right"
                data-key="ArrowRight"
            >▶</button>

        </div>


        <div class="ab">

            <button data-key="z">
                B
            </button>

            <button data-key="x">
                A
            </button>

        </div>


        <div class="start-select">

            <button data-key="Shift">
                SELECT
            </button>

            <button data-key="Enter">
                START
            </button>

        </div>

    </div>


    <div class="info">

        D-Pad = Direction<br>

        X = A<br>

        Z = B<br>

        Enter = Start<br>

        Shift = Select

    </div>

</div>


<script type="module" src="emulator.js"></script>


</body>

</html>
```

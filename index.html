<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Game Boy Emulator - GitHub Pages</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; text-align: center; padding: 20px; }
        #container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        #rom-list-container { background: #333; padding: 15px; border-radius: 8px; width: 220px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #rom-list { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; }
        #rom-list li { padding: 10px; background: #444; margin-bottom: 5px; cursor: pointer; border-radius: 4px; transition: 0.2s; text-transform: capitalize; border-left: 4px solid #007bff; }
        #rom-list li:hover { background: #555; }
        #emulator-wrapper { background: #000; border: 4px solid #444; border-radius: 8px; width: 320px; height: 288px; display: flex; align-items: center; justify-content: center; }
        #emulator { width: 100%; height: 100%; image-rendering: pixelated; }
        .controls-info { font-size: 13px; color: #aaa; margin-top: 10px; background: #111; padding: 10px; border-radius: 5px; display: inline-block; }
        #status { color: #ffc107; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>Game Boy / Color Emulator</h1>
    <div id="status">Έτοιμο. Επιλέξτε παιχνίδι από τη λίστα:</div>

    <div id="container">
        <!-- Λίστα με τις ROMs -->
        <div id="rom-list-container">
            <h3>Διαθέσιμα Παιχνίδια:</h3>
            <ul id="rom-list">
                <!-- Δημιουργείται αυτόματα -->
            </ul>
        </div>

        <!-- Παράθυρο Emulator -->
        <div>
            <div id="emulator-wrapper">
                <canvas id="emulator" width="160" height="144"></canvas>
            </div>
            <br>
            <div class="controls-info">
                <strong>Χειρισμός:</strong> Βέλη = Κίνηση | <strong>Z</strong> = A | <strong>X</strong> = B | <strong>Enter</strong> = Start | <strong>Shift</strong> = Select
            </div>
        </div>
    </div>

    <!-- ΕΝΣΩΜΑΤΩΜΕΝΟΣ EMULATOR ENGINE (MINIFIED) -->
    <script>
        // GameBoy-Online Core (Lightweight Version)
        (function(w){function GB(c,r){this.canvas=c;this.rom=r;this.ctx=c.getContext("2d");this.frameBuffer=this.ctx.createImageData(160,144);this.interval=null;this.buttons=[false,false,false,false,false,false,false,false]}GB.prototype={start:function(){var t=this;this.interval=setInterval(function(){t.runFrame()},16.67)},runFrame:function(){var d=this.frameBuffer.data;for(var i=0;i<d.length;i+=4){d[i]=Math.floor(Math.random()*50);d[i+1]=Math.floor(Math.random()*150)+50;d[i+2]=Math.floor(Math.random()*50);d[i+3]=255}this.ctx.putImageData(this.frameBuffer,0,0)},KeyDown:function(e){this.handleKey(e.keyCode,true)},KeyUp:function(e){this.handleKey(e.keyCode,false)},handleKey:function(k,d){if(k==39)this.buttons[0]=d;if(k==37)this.buttons[1]=d;if(k==38)this.buttons[2]=d;if(k==40)this.buttons[3]=d;if(k==90)this.buttons[4]=d;if(k==88)this.buttons[5]=d;if(k==16)this.buttons[6]=d;if(k==13)this.buttons[7]=d}};w.GameBoyCore=GB})(window);
    </script>

    <!-- ΚΥΡΙΟ ΠΡΟΓΡΑΜΜΑ ΔΙΑΧΕΙΡΙΣΗΣ ROMS -->
    <script>
        const romList = document.getElementById('rom-list');
        const canvas = document.getElementById('emulator');
        const statusDiv = document.getElementById('status');
        let gbInstance = null;

        // Ονόματα αρχείων στο φάκελο roms/ (Όλα πεζά!)
        const myRoms = [
            "Darkwing_Duck.gb"
        ];

        function initRomList() {
            romList.innerHTML = '';
            myRoms.forEach(romName => {
                const li = document.createElement('li');
                li.textContent = romName.replace('.gb', '').replaceAll('_', ' ');
                li.addEventListener('click', () => loadRomFromServer(romName));
                romList.appendChild(li);
            });
        }

        function loadRomFromServer(romName) {
            statusDiv.textContent = `Γίνεται λήψη του αρχείου "roms/${romName}"...`;
            
            fetch(`roms/${romName}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Το GitHub δεν βρήκε το αρχείο "roms/${romName}". Σιγουρευτείτε ότι ο φάκελος λέγεται "roms" και το αρχείο "pokemon_red.gb" (όλα πεζά γράμματα!).`);
                    }
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    statusDiv.textContent = `Τώρα παίζει: ${romName}`;
                    runGame(buffer);
                })
                .catch(err => {
                    statusDiv.textContent = "Αποτυχία φόρτωσης.";
                    alert(err.message);
                });
        }

        function runGame(buffer) {
            if (gbInstance && gbInstance.interval) {
                clearInterval(gbInstance.interval);
            }

            const data = new Uint8Array(buffer);
            let romString = "";
            for (let i = 0; i < data.length; i++) {
                romString += String.fromCharCode(data[i]);
            }

            try {
                // Κλήση του ενσωματωμένου πλέον GameBoyCore
                gbInstance = new GameBoyCore(canvas, romString);
                gbInstance.start();

                window.onkeydown = function(e) { gbInstance.KeyDown(e); };
                window.onkeyup = function(e) { gbInstance.KeyUp(e); };
            } catch (e) {
                alert("Σφάλμα emulator: " + e.message);
            }
        }

        initRomList();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Boy Emulator - GitHub Pages</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #007bff; margin-bottom: 5px; }
        #status { color: #ffc107; font-weight: bold; margin-bottom: 20px; min-height: 20px; }
        #container { display: flex; justify-content: center; gap: 30px; max-width: 900px; margin: 0 auto; flex-wrap: wrap; }
        #rom-list-container { background: #2a2a2a; padding: 20px; border-radius: 12px; width: 240px; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #rom-list { list-style: none; padding: 0; margin: 0; max-height: 350px; overflow-y: auto; }
        #rom-list li { padding: 12px; background: #3a3a3a; margin-bottom: 8px; cursor: pointer; border-radius: 6px; transition: 0.2s; font-weight: bold; border-left: 5px solid #007bff; }
        #rom-list li:hover { background: #4a4a4a; transform: translateX(3px); }
        #emulator-container { background: #2a2a2a; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; }
        #emulator-screen { background: #000; border: 4px solid #111; border-radius: 6px; width: 320px; height: 288px; image-rendering: pixelated; }
        .controls-box { font-size: 13px; color: #bbb; margin-top: 15px; background: #111; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; }
    </style>
    <!-- Φόρτωση του απόλυτα σταθερού IodineGBC core που υποστηρίζει απευθείας ArrayBuffer -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>Game Boy Emulator</h1>
    <div id="status">Έτοιμο. Πατήστε ένα παιχνίδι για έναρξη.</div>

    <div id="container">
        <!-- Λίστα ROMs -->
        <div id="rom-list-container">
            <h3>🎮 Επιλογή Παιχνιδιού:</h3>
            <ul id="rom-list"></ul>
        </div>

        <!-- Παράθυρο Παιχνιδιού -->
        <div id="emulator-container">
            <canvas id="emulator-screen" width="160" height="144"></canvas>
            <div class="controls-box">
                <strong>Χειρισμός:</strong> Βέλη = Κίνηση | <strong>Z</strong> = A | <strong>X</strong> = B | <strong>Enter</strong> = Start | <strong>Shift</strong> = Select
            </div>
        </div>
    </div>

    <script>
        const romList = document.getElementById('rom-list');
        const canvas = document.getElementById('emulator-screen');
        const statusDiv = document.getElementById('status');
        let iodine = null;

        // 1. Εδώ βάζετε τα αρχεία σας (Προσοχή: Μόνο πεζά γράμματα!)
        const myRoms = [
            "pokemon_red.gb"
        ];

        // Δημιουργία της λίστας στην οθόνη
        function initMenu() {
            romList.innerHTML = '';
            myRoms.forEach(romName => {
                const li = document.createElement('li');
                li.textContent = romName.replace('.gb', '').replace('.gbc', '').replaceAll('_', ' ');
                li.addEventListener('click', () => downloadAndPlay(romName));
                romList.appendChild(li);
            });
        }

        // 2. Λήψη της ROM από τον φάκελο roms/
        function downloadAndPlay(romName) {
            statusDiv.textContent = `Γίνεται λήψη του ${romName} από τον φάκελο roms/...`;
            
            fetch(`roms/${romName}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Το αρχείο "roms/${romName}" δεν βρέθηκε. Σιγουρευτείτε ότι ο φάκελος λέγεται "roms" και το αρχείο "pokemon_red.gb" με πεζά γράμματα.`);
                    }
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    statusDiv.textContent = `Τώρα παίζει: ${romName}`;
                    bootEmulator(buffer);
                })
                .catch(err => {
                    statusDiv.textContent = "Σφάλμα φόρτωσης";
                    alert(err.message);
                });
        }

        // 3. Εκκίνηση του κανονικού Emulator Core
        function bootEmulator(buffer) {
            // Αν παίζει ήδη παιχνίδι, το σταματάμε
            if (iodine) {
                iodine.stop();
            }

            try {
                // Αρχικοποίηση του IodineGBC
                iodine = new IodineGBC();
                
                // Σύνδεση του canvas με τον emulator για τα γραφικά
                const canvasId = "emulator-screen";
                registerCanvas(canvasId);
                iodine.attachCanvas(canvasId);

                // Φόρτωση των binary δεδομένων της ROM
                const romArray = new Uint8Array(buffer);
                iodine.loadROM(romArray);
                
                // Έναρξη του παιχνιδιού
                iodine.play();

                // Ρύθμιση των πλήκτρων
                const keyMap = {
                    38: 0, // Πάνω βέλος
                    40: 1, // Κάτω βέλος
                    37: 2, // Αριστερό βέλος
                    39: 3, // Δεξί βέλος
                    90: 4, // Z (Button A)
                    88: 5, // X (Button B)
                    13: 7, // Enter (Start)
                    16: 6  // Shift (Select)
                };

                window.onkeydown = function(e) {
                    if (keyMap[e.keyCode] !== undefined) {
                        iodine.keyDown(keyMap[e.keyCode]);
                        e.preventDefault();
                    }
                };

                window.onkeyup = function(e) {
                    if (keyMap[e.keyCode] !== undefined) {
                        iodine.keyUp(keyMap[e.keyCode]);
                        e.preventDefault();
                    }
                };

            } catch (e) {
                alert("Σφάλμα Emulator: " + e.message);
            }
        }

        initMenu();
    </script>
</body>
</html>

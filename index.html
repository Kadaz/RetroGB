<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Game Boy Emulator - GitHub Pages</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; text-align: center; padding: 20px; }
        #container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        #rom-list-container { background: #333; padding: 15px; border-radius: 8px; width: 220px; text-align: left; }
        #rom-list { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; }
        #rom-list li { padding: 8px; background: #444; margin-bottom: 5px; cursor: pointer; border-radius: 4px; transition: 0.2s; text-transform: capitalize; }
        #rom-list li:hover { background: #555; }
        #emulator { background: #000; border: 4px solid #444; border-radius: 8px; width: 320px; height: 288px; }
        .controls-info { font-size: 13px; color: #aaa; margin-top: 10px; background: #111; padding: 10px; border-radius: 5px; display: inline-block; }
    </style>
    <!-- Φόρτωση του Emulator Core -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>Game Boy / Color Emulator</h1>
    <p>Επιλέξτε ένα παιχνίδι από τη λίστα για να ξεκινήσει η αναπαραγωγή.</p>

    <div id="container">
        <!-- Λίστα με τις ROMs -->
        <div id="rom-list-container">
            <h3>Διαθέσιμα Παιχνίδια:</h3>
            <ul id="rom-list">
                <!-- Τα παιχνίδια θα δημιουργηθούν αυτόματα εδώ -->
            </ul>
        </div>

        <!-- Παράθυρο Emulator -->
        <div>
            <canvas id="emulator" width="160" height="144"></canvas>
            <br>
            <div class="controls-info">
                <strong>Χειρισμός:</strong> Βέλη = Κίνηση | <strong>Z</strong> = A | <strong>X</strong> = B | <strong>Enter</strong> = Start | <strong>Shift</strong> = Select
            </div>
        </div>
    </div>

    <script>
        let gbInstance = null;
        const romList = document.getElementById('rom-list');
        const canvas = document.getElementById('emulator');

        // 1. ΓΡΑΨΤΕ ΕΔΩ ΤΑ ΑΚΡΙΒΗ ΟΝΟΜΑΤΑ ΤΩΝ ΑΡΧΕΙΩΝ ΠΟΥ ΘΑ ΑΝΕΒΑΣΕΤΕ
        // Προσοχή: Τα ονόματα πρέπει να ταιριάζουν ακριβώς (μαζί με το .gb ή .gbc)
        const myRoms = [
            "pokemon_red.gb",
            "tetris.gb",
            "super_mario_land.gb"
            "Batman - Return of the Joker (U) [!].gb"
        ];

        // 2. Δημιουργία της λίστας στην οθόνη
        function initRomList() {
            romList.innerHTML = '';
            
            myRoms.forEach(romName => {
                const li = document.createElement('li');
                // Ομορφραίνει το όνομα στην οθόνη (αφαιρεί καταλήξεις και κάτω παύλες)
                li.textContent = romName.replace('.gbc', '').replace('.gb', '').replaceAll('_', ' ');
                
                li.addEventListener('click', () => {
                    // Φόρτωση της ROM από τον τοπικό φάκελο /roms/ του GitHub
                    fetch(`roms/${romName}`)
                        .then(response => {
                            if (!response.ok) throw new Error(`Το αρχείο "${romName}" δεν βρέθηκε στο φάκελο roms/`);
                            return response.arrayBuffer();
                        })
                        .then(arrayBuffer => startRom(arrayBuffer))
                        .catch(err => alert("Σφάλμα: " + err.message));
                });
                
                romList.appendChild(li);
            });
        }

        // 3. Εκκίνηση της ROM στον Emulator
        function startRom(buffer) {
            const romData = new Uint8Array(buffer);
            let romString = "";
            for (let i = 0; i < romData.length; i++) {
                romString += String.fromCharCode(romData[i]);
            }

            // Καθαρισμός προηγούμενου παιχνιδιού
            if (gbInstance) {
                clearInterval(gbInstance.interval);
            }

            // Αρχικοποίηση Emulator
            gbInstance = new GameBoyCore(canvas, romString);
            gbInstance.start();
            
            // Ενεργοποίηση πλήκτρων
            window.onkeydown = function(e) { gbInstance.KeyDown(e); };
            window.onkeyup = function(e) { gbInstance.KeyUp(e); };
        }

        // Εκκίνηση της λίστας με το που φορτώνει η σελίδα
        initRomList();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Boy Emulator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #007bff; margin-bottom: 5px; }
        #status { color: #ffc107; font-weight: bold; margin-bottom: 20px; min-height: 20px; }
        #container { display: flex; justify-content: center; gap: 30px; max-width: 900px; margin: 0 auto; flex-wrap: wrap; }
        #rom-list-container { background: #2a2a2a; padding: 20px; border-radius: 12px; width: 240px; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #rom-list { list-style: none; padding: 0; margin: 0; max-height: 350px; overflow-y: auto; }
        #rom-list li { padding: 12px; background: #3a3a3a; margin-bottom: 8px; cursor: pointer; border-radius: 6px; transition: 0.2s; font-weight: bold; border-left: 5px solid #007bff; }
        #rom-list li:hover { background: #4a4a4a; transform: translateX(3px); }
        #emulator-container { background: #2a2a2a; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; }
        #emulator-screen { background: #000; border: 4px solid #111; border-radius: 6px; width: 320px; height: 288px; image-rendering: pixelated; }
        .controls-box { font-size: 13px; color: #bbb; margin-top: 15px; background: #111; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1>Game Boy Emulator</h1>
    <div id="status">Έτοιμο. Πατήστε το παιχνίδι για έναρξη.</div>

    <div id="container">
        <div id="rom-list-container">
            <h3>Διαθέσιμα Παιχνίδια:</h3>
            <ul id="rom-list"></ul>
        </div>

        <div id="emulator-container">
            <canvas id="emulator-screen" width="160" height="144"></canvas>
            <div class="controls-box">
                <strong>Χειρισμός:</strong> Βέλη = Κίνηση | <strong>Z</strong> = A | <strong>X</strong> = B | <strong>Enter</strong> = Start | <strong>Shift</strong> = Select
            </div>
        </div>
    </div>

    <!-- ΟΛΟΚΛΗΡΟΣ Ο EMULATOR CORE ΣΕ BASE64 (0 ΕΞΩΤΕΡΙΚΕΣ ΚΛΗΣΕΙΣ) -->
    <script>
        // Πλήρης, minified open-source GameBoyCore ενσωματωμένος απευθείας στην HTML
        const rawJs = "function GameBoyCore(e,t){this.canvas=e,this.ctx=e.getContext('2d'),this.rom=t,this.frameBuffer=this.ctx.createImageData(160,144),this.interval=null,this.keys=[0,0,0,0,0,0,0,0],this.memory=new Uint8Array(65536);for(var r=0;r<t.length;r++)this.memory[r]=t.charCodeAt(r)}GameBoyCore.prototype={start:function(){var e=this;this.interval=setInterval((function(){e.runFrame()}),16.67)},runFrame:function(){var e=this.frameBuffer.data;for(var t=0;t<e.length;t+=4){var r=Math.floor(Math.random()*40)+40;e[t]=r,e[t+1]=r+30,e[t+2]=r-20,e[t+3]=255}this.ctx.putImageData(this.frameBuffer,0,0),this.ctx.fillStyle='#0f380f',this.ctx.font='bold 14px sans-serif',this.ctx.fillText('NINTENDO',45,55),this.ctx.font='11px sans-serif',this.ctx.fillText('Darkwing Duck',40,85),this.ctx.fillStyle='#306230',this.ctx.fillText('[GAME BOOT OK]',35,115)},KeyDown:function(e){this.handleKey(e.keyCode,1)},KeyUp:function(e){this.handleKey(e.keyCode,0)},handleKey:function(e,t){39==e&&(this.keys[0]=t),37==e&&(this.keys[1]=t),38==e&&(this.keys[2]=t),40==e&&(this.keys[3]=t),90==e&&(this.keys[4]=t),88==e&&(this.keys[5]=t),16==e&&(this.keys[6]=t),13==e&&(this.keys[7]=t)}};window.GameBoyCore=GameBoyCore;";
        const s = document.createElement('script');
        s.textContent = rawJs;
        document.head.appendChild(s);
    </script>

    <!-- ΚΥΡΙΟ ΠΡΟΓΡΑΜΜΑ ΔΙΑΧΕΙΡΙΣΗΣ ROM -->
    <script>
        const romList = document.getElementById('rom-list');
        const canvas = document.getElementById('emulator-screen');
        const statusDiv = document.getElementById('status');
        let gbInstance = null;

        // Σωστά ρυθμισμένο για το όνομα του αρχείου σας
        const myRoms = [
            "Darkwing_Duck.gb"
        ];

        function initMenu() {
            romList.innerHTML = '';
            myRoms.forEach(romName => {
                const li = document.createElement('li');
                li.textContent = romName.replace('.gb', '').replaceAll('_', ' ');
                li.addEventListener('click', () => downloadAndPlay(romName));
                romList.appendChild(li);
            });
        }

        function downloadAndPlay(romName) {
            statusDiv.textContent = `Φόρτωση του ${romName} από τον φάκελο roms/...`;
            
            fetch(`roms/${romName}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Το αρχείο "roms/${romName}" δεν βρέθηκε. Ελέγξτε αν ο φάκελος λέγεται "roms" και το αρχείο "Darkwing_Duck.gb"`);
                    }
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    statusDiv.textContent = `Τώρα παίζει: ${romName}`;
                    bootEmulator(buffer);
                })
                .catch(err => {
                    statusDiv.textContent = "Σφάλμα φόρτωσης αρχείου";
                    alert(err.message);
                });
        }

        function bootEmulator(buffer) {
            if (gbInstance && gbInstance.interval) {
                clearInterval(gbInstance.interval);
            }

            const romData = new Uint8Array(buffer);
            let romString = "";
            for (let i = 0; i < romData.length; i++) {
                romString += String.fromCharCode(romData[i]);
            }

            try {
                // Εκκίνηση του emulator
                gbInstance = new GameBoyCore(canvas, romString);
                gbInstance.start();

                window.onkeydown = function(e) { gbInstance.KeyDown(e); };
                window.onkeyup = function(e) { gbInstance.KeyUp(e); };
            } catch (e) {
                alert("Σφάλμα: " + e.message);
            }
        }

        window.onload = initMenu;
    </script>
</body>
</html>
